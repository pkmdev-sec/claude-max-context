<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bar-stock" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="bar-opt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="textshadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity="0.5"/>
  <rect x="0" y="0" width="1200" height="60" fill="url(#glow)"/>

  <!-- Title -->
  <text x="64" y="52" fill="#f0f0f5" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" filter="textshadow">claude-max-context</text>
  <text x="64" y="72" fill="#9ca3af" font-family="system-ui,-apple-system,sans-serif" font-size="13" letter-spacing="0.3">Maximize Claude Code's usable context window</text>

  <!-- Bars area: x=64, y=100 -->
  <!-- Stock bar -->
  <text x="64" y="112" fill="#6b7280" font-family="ui-monospace,monospace" font-size="11" font-weight="500">STOCK</text>
  <rect x="160" y="100" width="650" height="20" rx="4" fill="#1a1a2e" stroke="#2d2d44" stroke-width="1"/>
  <rect x="160" y="100" width="455" height="20" rx="4" fill="url(#bar-stock)"/>
  <text x="170" y="114" fill="#e5e7eb" font-family="ui-monospace,monospace" font-size="10" font-weight="600">686K</text>
  <text x="624" y="114" fill="#4b5563" font-family="ui-monospace,monospace" font-size="10">70% of Kc</text>

  <!-- Optimized bar -->
  <text x="64" y="148" fill="#c4b5fd" font-family="ui-monospace,monospace" font-size="11" font-weight="600">OPTIMIZED</text>
  <rect x="160" y="136" width="650" height="20" rx="4" fill="#1a1a2e" stroke="#2d2d44" stroke-width="1"/>
  <rect x="160" y="136" width="618" height="20" rx="4" fill="url(#bar-opt)"/>
  <text x="170" y="150" fill="#fff" font-family="ui-monospace,monospace" font-size="10" font-weight="700">931K</text>

  <!-- Multiplier badge -->
  <rect x="786" y="136" width="58" height="20" rx="10" fill="#7c3aed"/>
  <text x="815" y="150" fill="#fff" font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="middle">1.36x</text>

  <!-- Scale -->
  <text x="160" y="176" fill="#374151" font-family="ui-monospace,monospace" font-size="9">0</text>
  <text x="322" y="176" fill="#374151" font-family="ui-monospace,monospace" font-size="9">250K</text>
  <text x="485" y="176" fill="#374151" font-family="ui-monospace,monospace" font-size="9">500K</text>
  <text x="647" y="176" fill="#374151" font-family="ui-monospace,monospace" font-size="9">750K</text>
  <text x="790" y="176" fill="#374151" font-family="ui-monospace,monospace" font-size="9">~1M</text>

  <!-- Features -->
  <circle cx="72" cy="210" r="3.5" fill="#8b5cf6" opacity="0.9"/>
  <text x="84" y="214" fill="#d1d5db" font-family="system-ui,sans-serif" font-size="12">Delays compaction from 70% to 95%</text>

  <circle cx="72" cy="234" r="3.5" fill="#8b5cf6" opacity="0.7"/>
  <text x="84" y="238" fill="#d1d5db" font-family="system-ui,sans-serif" font-size="12">Hooks preserve state across compaction</text>

  <circle cx="72" cy="258" r="3.5" fill="#8b5cf6" opacity="0.5"/>
  <text x="84" y="262" fill="#d1d5db" font-family="system-ui,sans-serif" font-size="12">HANDOFF.md carries context between sessions</text>

  <circle cx="72" cy="282" r="3.5" fill="#8b5cf6" opacity="0.3"/>
  <text x="84" y="286" fill="#d1d5db" font-family="system-ui,sans-serif" font-size="12">Auto-detects token limit, defaults conservative</text>

  <!-- Install line -->
  <text x="530" y="286" fill="#4b5563" font-family="ui-monospace,monospace" font-size="11">$ bash install.sh</text>

  <rect x="0" y="318" width="1200" height="2" fill="url(#accent)" opacity="0.25"/>
</svg>
